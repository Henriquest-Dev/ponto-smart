# Deploy na Netlify — o Next.js é detectado automaticamente e servido pelo runtime oficial
# (OpenNext). Não fixar o plugin aqui evita conflitos de versão no build.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"
